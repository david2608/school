<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UX/UI Design Course Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef4fb;
      --bg-deep: #dce8f7;
      --panel: #ffffff;
      --panel-soft: #f7faff;
      --line: #d7e3f2;
      --line-strong: #c4d5ea;
      --ink: #101827;
      --muted: #5f718f;
      --muted-strong: #334155;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --violet: #7c3aed;
      --violet-soft: rgba(124, 58, 237, 0.14);
      --sidebar: #0f172a;
      --sidebar-soft: #172033;
      --success: #0f766e;
      --warn: #c2410c;
      --danger: #b91c1c;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.14);
      --shadow-md: 0 16px 38px rgba(15, 23, 42, 0.09);
      --page-ratio: 842 / 595;
      --deck-width: 1220px;
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --slide-header-width: 860px;
      --slide-copy-width: 760px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.12), transparent 28%),
        radial-gradient(circle at bottom left, rgba(124, 58, 237, 0.08), transparent 24%),
        linear-gradient(180deg, var(--bg) 0%, #f7fbff 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 24px 18px 22px;
      color: #f8fbff;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.32), transparent 24%),
        linear-gradient(180deg, #10182b 0%, #0f172a 48%, #111b31 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar::-webkit-scrollbar {
      width: 10px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }

    .sidebar-header {
      display: grid;
      gap: 12px;
      padding: 10px 10px 18px;
    }

    .sidebar-eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #dbeafe;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    .sidebar-title {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.15;
      font-weight: 800;
    }

    .sidebar-copy {
      margin: 0;
      color: rgba(236, 244, 255, 0.76);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .sidebar-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .sidebar-stat {
      padding: 12px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar-stat strong {
      display: block;
      font-size: 1.15rem;
      margin-bottom: 4px;
    }

    .sidebar-stat span {
      display: block;
      color: rgba(236, 244, 255, 0.74);
      font-size: 0.84rem;
    }

    .lesson-list {
      display: grid;
      gap: 10px;
      margin-top: 8px;
      padding-bottom: 18px;
    }

    .lesson-item {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.04);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .lesson-item:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.07);
    }

    .lesson-item.active {
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.22), rgba(37, 99, 235, 0.08));
      border-color: rgba(96, 165, 250, 0.34);
      box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.16);
    }

    .lesson-item.muted {
      opacity: 0.56;
    }

    .lesson-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .lesson-number {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(219, 234, 254, 0.68);
    }

    .lesson-count {
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.72);
    }

    .lesson-name {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.45;
      font-weight: 700;
      color: #f8fbff;
      text-align: left;
    }

    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .pill.workshop {
      color: #f3e8ff;
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid rgba(196, 181, 253, 0.24);
    }

    .pill.available {
      color: #dcfce7;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(110, 231, 183, 0.2);
    }

    .pill.pending {
      color: #dbeafe;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .main-shell {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      background: rgba(247, 251, 255, 0.84);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .menu-button,
    .topbar-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted-strong);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .menu-button:hover,
    .topbar-action:hover,
    .nav-arrow:hover,
    .inline-action:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
    }

    .menu-button {
      display: none;
    }

    .topbar-heading {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .topbar-heading strong {
      font-size: 1rem;
      font-weight: 800;
    }

    .topbar-heading span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      min-width: 180px;
      padding: 14px 16px 14px 46px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      color: var(--ink);
    }

    .search-wrap svg {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #f7fbff);
      border: 1px solid var(--line);
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.06);
      white-space: nowrap;
    }

    .progress-pill strong {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .progress-pill span {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .content-shell {
      padding: 24px;
      display: grid;
      gap: 18px;
    }

    .panel-shell {
      display: grid;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: flex-end;
    }

    .panel-tabs {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
    }

    .panel-tab {
      min-width: 116px;
      padding: 12px 18px;
      font-weight: 700;
      color: var(--muted);
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .panel-tab:hover {
      color: var(--muted-strong);
      transform: translateY(-1px);
    }

    .panel-tab.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 14px 26px rgba(37, 99, 235, 0.22);
    }

    .content-panel {
      display: none;
    }

    .content-panel.active {
      display: block;
    }

    .lesson-hero {
      position: relative;
      overflow: hidden;
      padding: 26px 28px;
      border-radius: 28px;
      border: 1px solid rgba(37, 99, 235, 0.12);
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.12), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 251, 255, 0.96));
      box-shadow: var(--shadow-md);
    }

    .lesson-hero::after {
      content: "";
      position: absolute;
      inset: auto -60px -60px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.16), transparent 70%);
      pointer-events: none;
    }

    .lesson-hero-inner {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      max-width: 900px;
    }

    .lesson-hero-topline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .lesson-hero h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.04;
    }

    .lesson-hero p {
      margin: 0;
      color: var(--muted-strong);
      line-height: 1.72;
      font-size: 1rem;
      max-width: 78ch;
    }

    .lesson-source {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 4px;
    }

    .lesson-source a,
    .inline-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted-strong);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.05);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .viewer-shell {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) 64px;
      align-items: center;
      gap: 14px;
    }

    .nav-arrow {
      align-self: stretch;
      width: 64px;
      min-height: 100%;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      color: var(--muted-strong);
      box-shadow: 0 18px 28px rgba(15, 23, 42, 0.07);
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .nav-arrow:disabled {
      opacity: 0.32;
      cursor: not-allowed;
      transform: none;
    }

    .viewer-stage {
      min-width: 0;
      display: grid;
      gap: 14px;
      width: min(100%, var(--deck-width));
      margin: 0 auto;
    }

    .slide-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 6px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .slide-toolbar-left,
    .slide-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .slide-position {
      font-weight: 700;
      color: var(--muted-strong);
    }

    .slide-card {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: var(--page-ratio);
      border-radius: 0;
      border: 1px solid rgba(37, 99, 235, 0.1);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 20%),
        radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.05), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 251, 255, 0.98));
      box-shadow: var(--shadow-lg);
      padding: clamp(20px, 2vw, 34px);
      animation: slideFade 260ms ease;
      overflow: auto;
    }

    @keyframes slideFade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slide-card::before,
    .detail-panel::before {
      content: "";
      position: absolute;
      inset: auto auto -100px -100px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.11), transparent 68%);
      pointer-events: none;
    }

    .slide-content {
      position: relative;
      z-index: 1;
      min-height: 100%;
      height: 100%;
      display: grid;
      gap: 28px;
      align-content: start;
    }

    .slide-header {
      display: grid;
      gap: 14px;
      max-width: var(--slide-header-width);
    }

    .slide-eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.12), rgba(37, 99, 235, 0.07));
      border: 1px solid rgba(37, 99, 235, 0.14);
      color: var(--accent-strong);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .slide-title {
      margin: 0;
      max-width: 15ch;
      font-size: clamp(2.1rem, 3vw, 3.35rem);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--ink);
    }

    .slide-title.dark {
      color: var(--ink);
    }

    .slide-subtitle {
      margin: 0;
      max-width: var(--slide-copy-width);
      color: var(--muted-strong);
      font-size: 1.04rem;
      line-height: 1.72;
    }

    .slide-body {
      display: grid;
      gap: 22px;
      align-content: start;
    }

    .slide-copy {
      display: grid;
      gap: 16px;
      max-width: var(--slide-copy-width);
      line-height: 1.78;
      font-size: 1.03rem;
      color: var(--muted-strong);
    }

    .slide-copy p {
      margin: 0;
    }

    .title-center,
    .prompt-slide,
    .closing-slide {
      min-height: 100%;
      place-items: center;
      align-content: center;
      text-align: center;
    }

    .cover-slide {
      min-height: 100%;
      align-content: center;
      gap: 18px;
      padding-left: 54px;
    }

    .cover-accent {
      position: absolute;
      left: 0;
      top: 170px;
      width: 190px;
      height: 64px;
      border-radius: 0 16px 16px 0;
      background: var(--accent);
    }

    .cover-kicker {
      display: inline-flex;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.2);
      background: rgba(255, 255, 255, 0.78);
      color: var(--accent-strong);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .cover-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 4rem);
      line-height: 1.02;
      max-width: 12ch;
      color: var(--accent-strong);
    }

    .cover-copy {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 1.05rem;
      max-width: 60ch;
      color: var(--muted-strong);
      line-height: 1.72;
    }

    .profile-layout {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 24px;
      align-items: center;
    }

    .avatar-card {
      width: 210px;
      height: 210px;
      border-radius: 32px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(124, 58, 237, 0.14));
      border: 1px solid rgba(37, 99, 235, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .avatar-card.has-photo {
      border: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
    }

    .avatar-core {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #ffffff, #edf4ff);
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-strong);
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.12);
    }

    .profile-photo-frame {
      width: 210px;
      height: 210px;
      border: 1px solid rgba(37, 99, 235, 0.14);
      background: #eff6ff;
    }

    .media-frame {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #f8fbff;
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.05);
    }

    .media-asset {
      display: block;
      width: 100%;
      height: 100%;
      background: #f8fbff;
    }

    .definition-layout,
    .statement-layout,
    .history-hero,
    .timeline-content,
    .prompt-answer-layout {
      display: grid;
      gap: 18px;
      align-items: start;
    }

    .definition-layout,
    .statement-layout,
    .prompt-answer-layout {
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.84fr);
    }

    .history-hero {
      grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1fr);
    }

    .timeline-content {
      grid-template-columns: minmax(0, 1fr) 320px;
    }

    .side-media-frame,
    .visual-media-frame,
    .prompt-media-frame,
    .timeline-media-frame,
    .quote-media-frame,
    .chart-media-frame,
    .history-media-frame,
    .books-banner,
    .comparison-media-frame,
    .gallery-media-frame {
      min-height: 240px;
    }

    .visual-media-frame {
      min-height: 320px;
    }

    .prompt-media-frame,
    .quote-media-frame,
    .history-media-frame {
      min-height: 320px;
    }

    .books-banner {
      min-height: 220px;
    }

    .chart-media-frame {
      padding: 10px;
      background: white;
    }

    .comparison-media-frame {
      margin-bottom: 14px;
    }

    .profile-main {
      display: grid;
      gap: 16px;
    }

    .profile-name {
      margin: 0;
      font-size: 2rem;
      color: var(--ink);
    }

    .profile-roles,
    .bullet-grid,
    .benefit-list,
    .resource-list,
    .homework-list,
    .quiz-list,
    .note-list {
      display: grid;
      gap: 10px;
    }

    .profile-roles li,
    .benefit-list li,
    .resource-list li,
    .homework-list li,
    .note-list li {
      list-style: none;
      position: relative;
      padding-left: 18px;
      line-height: 1.6;
      color: var(--muted-strong);
    }

    .profile-roles li::before,
    .benefit-list li::before,
    .resource-list li::before,
    .homework-list li::before,
    .note-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.78em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateY(-50%);
    }

    .stat-grid,
    .overview-grid,
    .comparison-grid,
    .gallery-grid,
    .resource-grid,
    .detail-grid,
    .quiz-grid,
    .cards-grid {
      display: grid;
      gap: 14px;
    }

    .stat-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .metric-card,
    .mini-card,
    .comparison-card,
    .gallery-card,
    .detail-card,
    .resource-card,
    .quiz-card,
    .role-card,
    .tag-card,
    .panel-card {
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 251, 255, 0.92));
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .metric-card strong,
    .mini-card strong,
    .tag-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1.08rem;
    }

    .metric-card span,
    .mini-card span,
    .tag-card span {
      color: var(--muted);
      line-height: 1.55;
    }

    .overview-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .gallery-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .overview-card h3,
    .comparison-card h3,
    .detail-card h3,
    .quiz-card h3,
    .resource-card h3,
    .panel-card h3 {
      margin: 0 0 10px;
      font-size: 1.08rem;
      line-height: 1.3;
      color: var(--ink);
    }

    .overview-card p,
    .comparison-card p,
    .gallery-card p,
    .detail-card p,
    .resource-card p,
    .quiz-card p,
    .panel-card p,
    .role-card p {
      margin: 0;
      color: var(--muted-strong);
      line-height: 1.68;
    }

    .split-layout,
    .dual-layout,
    .timeline-layout,
    .comparison-grid,
    .visual-layout,
    .usability-layout,
    .quote-layout,
    .history-layout {
      display: grid;
      gap: 22px;
    }

    .split-layout {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .bullet-grid {
      gap: 9px;
      margin: 0;
      padding: 0;
    }

    .bullet-grid li {
      list-style: none;
      padding-left: 18px;
      position: relative;
      line-height: 1.6;
      color: var(--muted-strong);
    }

    .bullet-grid li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.78em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateY(-50%);
    }

    .keyword-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .keyword-chip {
      min-height: 124px;
      padding: 24px 30px;
      border-radius: 28px;
      border: 1px solid rgba(37, 99, 235, 0.14);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(240, 247, 255, 0.94));
      color: var(--accent-strong);
      display: grid;
      place-items: center;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .keyword-chip.secondary {
      color: var(--ink);
      min-height: auto;
      padding: 16px 20px;
      border-radius: 999px;
      font-size: 1.4rem;
    }

    .statement-card {
      max-width: 900px;
      padding: 26px 28px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 251, 255, 0.9));
      border: 1px solid var(--line);
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.05);
      line-height: 1.82;
      font-size: 1.08rem;
      color: var(--muted-strong);
    }

    .statement-card strong {
      color: var(--ink);
    }

    .visual-layout {
      grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr);
      align-items: center;
    }

    .visual-board {
      min-height: 300px;
      padding: 24px;
      border-radius: 28px;
      border: 1px solid rgba(37, 99, 235, 0.12);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(240, 247, 255, 0.96));
      display: grid;
      place-items: center;
    }

    .cups-visual,
    .phones-visual,
    .device-stack {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 20px;
    }

    .cup {
      position: relative;
      width: 150px;
      height: 170px;
      border-radius: 24px 24px 28px 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.06)), var(--cup);
      box-shadow: inset 0 10px 16px rgba(255, 255, 255, 0.24), 0 20px 30px rgba(15, 23, 42, 0.12);
    }

    .cup::before {
      content: "";
      position: absolute;
      inset: 16px auto auto 16px;
      width: 116px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.38);
      filter: blur(1px);
    }

    .cup::after {
      content: "";
      position: absolute;
      top: 44px;
      right: -28px;
      width: 52px;
      height: 78px;
      border: 14px solid var(--cup);
      border-left-color: transparent;
      border-radius: 999px;
      opacity: 0.85;
    }

    .phone {
      position: relative;
      width: 150px;
      height: 280px;
      padding: 18px 14px;
      border-radius: 30px;
      border: 1px solid rgba(148, 163, 184, 0.34);
      background: linear-gradient(180deg, #ffffff, #f1f5f9);
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.1);
      display: grid;
      gap: 12px;
      overflow: hidden;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      width: 68px;
      height: 10px;
      border-radius: 999px;
      background: #e5e7eb;
      transform: translateX(-50%);
    }

    .phone-row,
    .phone-card,
    .phone-tab {
      border-radius: 12px;
      background: #e5e7eb;
    }

    .phone-row {
      height: 14px;
    }

    .phone-card {
      flex: 1;
      min-height: 100px;
    }

    .phone-footer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .phone-tab {
      height: 30px;
    }

    .triad-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .triad-card {
      padding: 18px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.05);
    }

    .triad-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--accent-strong);
      font-size: 1rem;
    }

    .triad-card p {
      margin: 0;
      color: var(--muted-strong);
      line-height: 1.65;
    }

    .role-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .role-card {
      display: grid;
      gap: 10px;
      min-height: 150px;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .role-card.active {
      border-color: rgba(37, 99, 235, 0.22);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.12), rgba(255, 255, 255, 0.94));
      transform: translateY(-2px);
    }

    .role-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-weight: 800;
    }

    .role-icon.has-media {
      padding: 6px;
      background: rgba(37, 99, 235, 0.08);
    }

    .role-card h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--ink);
    }

    .role-card p {
      font-size: 0.92rem;
    }

    .prompt-block {
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
      max-width: 760px;
      margin: 0 auto;
    }

    .prompt-answer-layout .prompt-block {
      max-width: none;
    }

    .prompt-block .thought-badge {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 2rem;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.14), rgba(124, 58, 237, 0.12));
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.08);
    }

    .prompt-answer {
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 1;
      margin: 0;
      color: var(--accent-strong);
      font-weight: 800;
    }

    .timeline-layout {
      grid-template-columns: 120px minmax(0, 1fr);
      align-items: stretch;
      gap: 24px;
    }

    .timeline-rail {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .timeline-rail::before {
      content: "";
      position: absolute;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, #dbe7f6, #eff5fb);
    }

    .timeline-dot {
      position: relative;
      z-index: 1;
      width: 30px;
      height: 30px;
      margin-top: 48px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 16px rgba(37, 99, 235, 0.08);
    }

    .timeline-body {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .timeline-heading {
      display: grid;
      gap: 4px;
    }

    .timeline-heading strong {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1;
      color: var(--ink);
    }

    .timeline-heading span {
      font-size: 1.35rem;
      line-height: 1.28;
      font-weight: 700;
      color: var(--muted-strong);
    }

    .quote-layout {
      grid-template-columns: 320px minmax(0, 1fr);
      align-items: center;
      gap: 28px;
    }

    .book-cover {
      min-height: 420px;
      padding: 26px;
      border-radius: 28px;
      background: linear-gradient(180deg, #d14a33, #b53622);
      color: #fff7ed;
      display: grid;
      align-content: space-between;
      box-shadow: 0 24px 40px rgba(180, 54, 34, 0.24);
    }

    .book-cover small {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.88;
    }

    .book-cover strong {
      font-size: 2rem;
      line-height: 1.05;
      display: block;
    }

    .quote-block {
      display: grid;
      gap: 18px;
      font-size: 1.25rem;
      line-height: 1.7;
      color: var(--muted-strong);
    }

    .quote-block p {
      margin: 0;
    }

    .quote-block strong {
      color: var(--ink);
    }

    .chart-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.78fr);
      gap: 28px;
      align-items: center;
    }

    .chart-shell.media-shell {
      grid-template-columns: minmax(300px, 0.92fr) minmax(0, 1fr);
      align-items: stretch;
    }

    .bar-chart {
      display: grid;
      gap: 14px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) 86px;
      align-items: center;
      gap: 14px;
    }

    .bar-label {
      font-weight: 600;
      color: var(--muted-strong);
    }

    .bar-track {
      height: 16px;
      border-radius: 999px;
      background: #e8eef7;
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #60a5fa);
    }

    .bar-value {
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }

    .donut-shell {
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    .donut {
      --chart: conic-gradient(var(--accent) 0 100%);
      position: relative;
      width: 240px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--chart);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 18px 30px rgba(15, 23, 42, 0.08);
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 32px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffffff, #f7fbff);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .donut span {
      position: absolute;
      inset: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      text-align: center;
      font-size: 0.92rem;
      color: var(--muted);
      width: 120px;
    }

    .legend {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .legend-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .legend-label {
      color: var(--muted-strong);
      line-height: 1.45;
    }

    .legend-value {
      font-weight: 700;
      color: var(--ink);
    }

    .chart-note {
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(37, 99, 235, 0.12);
      background: rgba(37, 99, 235, 0.06);
      color: var(--muted-strong);
      line-height: 1.65;
    }

    .usability-layout {
      grid-template-columns: minmax(0, 1fr) 280px;
      align-items: center;
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .puzzle-piece {
      min-height: 180px;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, #ffffff, #eff6ff);
      border: 1px solid var(--line);
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.06);
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .puzzle-piece strong {
      display: block;
      font-size: 1rem;
      color: var(--ink);
    }

    .puzzle-piece span {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.92rem;
    }

    .comparison-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .comparison-visual {
      min-height: 210px;
      border-radius: 22px;
      background: linear-gradient(180deg, #f8fbff, #edf4ff);
      border: 1px solid var(--line);
      display: grid;
      align-content: start;
      margin-bottom: 14px;
      overflow: hidden;
      padding: 12px;
    }

    .comparison-badge {
      display: inline-flex;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.12);
      color: var(--accent-strong);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .comparison-card:nth-child(2) .comparison-badge {
      background: rgba(16, 185, 129, 0.14);
      color: #047857;
    }

    .comparison-visual.ketchup::before,
    .comparison-visual.ketchup::after,
    .comparison-visual.remote::before,
    .comparison-visual.remote::after,
    .comparison-visual.google::before,
    .comparison-visual.google::after,
    .comparison-visual.apple::before,
    .comparison-visual.apple::after,
    .comparison-visual.elevator::before,
    .comparison-visual.elevator::after {
      content: "";
      display: block;
    }

    .comparison-visual.ketchup {
      position: relative;
      gap: 18px;
    }

    .comparison-visual.ketchup::before,
    .comparison-visual.ketchup::after {
      position: absolute;
      inset: auto auto 20px auto;
      width: 74px;
      height: 150px;
      border-radius: 32px 32px 18px 18px;
      background: linear-gradient(180deg, #d11f1f, #c21b1b);
      box-shadow: inset 0 18px 0 rgba(255, 255, 255, 0.22);
    }

    .comparison-visual.ketchup::before {
      left: 72px;
      transform: scaleX(0.76);
    }

    .comparison-visual.ketchup::after {
      right: 72px;
      border-radius: 28px 28px 24px 24px;
      transform: rotate(180deg);
    }

    .comparison-visual.remote {
      position: relative;
    }

    .comparison-visual.remote::before,
    .comparison-visual.remote::after {
      position: absolute;
      top: 24px;
      width: 86px;
      height: 162px;
      border-radius: 26px;
      background: linear-gradient(180deg, #111827, #334155);
    }

    .comparison-visual.remote::before {
      left: 68px;
      box-shadow:
        0 0 0 0 transparent,
        inset 0 -46px 0 rgba(255, 255, 255, 0.05),
        0 0 0 16px transparent;
    }

    .comparison-visual.remote::after {
      right: 68px;
      background: linear-gradient(180deg, #f3f4f6, #cbd5e1);
    }

    .comparison-visual.google {
      position: relative;
      font-weight: 800;
      color: #1f2937;
      font-size: 2rem;
    }

    .comparison-visual.google::before,
    .comparison-visual.google::after {
      position: absolute;
      top: 70px;
      width: 180px;
      height: 74px;
      border-radius: 20px;
      background: white;
      border: 1px solid var(--line);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.05);
    }

    .comparison-visual.google::before {
      left: 42px;
    }

    .comparison-visual.google::after {
      right: 42px;
    }

    .comparison-visual.apple {
      position: relative;
    }

    .comparison-visual.apple::before,
    .comparison-visual.apple::after {
      position: absolute;
      inset: auto auto auto auto;
      width: 180px;
      height: 120px;
      border-radius: 18px;
      background: white;
      border: 1px solid var(--line);
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.06);
    }

    .comparison-visual.apple::before {
      left: 44px;
      top: 44px;
    }

    .comparison-visual.apple::after {
      right: 44px;
      top: 64px;
    }

    .comparison-visual.elevator {
      position: relative;
    }

    .comparison-visual.elevator::before,
    .comparison-visual.elevator::after {
      position: absolute;
      top: 28px;
      width: 160px;
      height: 164px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #faf7ef, #f5e4bb);
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.06);
    }

    .comparison-visual.elevator::before {
      left: 28px;
    }

    .comparison-visual.elevator::after {
      right: 28px;
      background: linear-gradient(180deg, #ffffff, #eef2ff);
    }

    .history-layout {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .history-card {
      display: grid;
      gap: 10px;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.05);
    }

    .history-card strong {
      font-size: 1.2rem;
      line-height: 1.15;
      color: var(--ink);
    }

    .history-card p {
      margin: 0;
      line-height: 1.68;
      color: var(--muted-strong);
    }

    .acronym-grid {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
    }

    .acronym-code {
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.08em;
    }

    .books-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .book-tile {
      min-height: 210px;
      padding: 18px;
      border-radius: 22px;
      color: white;
      display: grid;
      align-content: space-between;
      box-shadow: 0 20px 32px rgba(15, 23, 42, 0.08);
    }

    .book-tile small {
      opacity: 0.86;
      font-weight: 600;
    }

    .book-tile strong {
      font-size: 1.3rem;
      line-height: 1.08;
      display: block;
    }

    .slide-note {
      max-width: 70ch;
      padding-left: 16px;
      border-left: 3px solid rgba(37, 99, 235, 0.18);
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.68;
    }

    .detail-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
    }

    .detail-card,
    .detail-panel {
      min-height: 100%;
    }

    .detail-panel {
      position: relative;
      width: min(100%, var(--deck-width));
      aspect-ratio: var(--page-ratio);
      margin: 0 auto;
      display: grid;
      gap: 18px;
      align-content: start;
      padding: clamp(20px, 2vw, 34px);
      border-radius: 0;
      border: 1px solid rgba(37, 99, 235, 0.1);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 20%),
        radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.05), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 251, 255, 0.98));
      box-shadow: var(--shadow-lg);
      overflow: auto;
    }

    .detail-panel > * {
      position: relative;
      z-index: 1;
    }

    .detail-card h2,
    .detail-panel h2 {
      margin: 0 0 14px;
      font-size: 1.25rem;
      color: var(--ink);
    }

    .detail-card .empty,
    .detail-panel .empty {
      color: var(--muted);
      line-height: 1.7;
    }

    .resource-card small,
    .quiz-card small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.55;
    }

    .resource-card a {
      color: var(--accent-strong);
      font-weight: 700;
    }

    .quiz-card ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 8px;
      color: var(--muted-strong);
      line-height: 1.6;
    }

    details.quiz-answer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    details.quiz-answer summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--accent-strong);
    }

    .no-results {
      padding: 22px;
      border-radius: 22px;
      border: 1px dashed var(--line-strong);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderMediaAsset(media, figureClass = "", mediaClass = "") {
      if (!media?.src) return "";

      const type = media.type || (/\.(mp4|webm|ogg|mov)$/i.test(media.src) ? "video" : "image");
      const figureClasses = ["media-frame", figureClass].filter(Boolean).join(" ");
      const assetClasses = ["media-asset", mediaClass].filter(Boolean).join(" ");
      const fit = media.fit || "cover";
      const position = media.position || "center";
      const sharedStyle = `object-fit:${escapeHtml(fit)};object-position:${escapeHtml(position)};`;

      if (type === "video") {
        return `
          <figure class="${figureClasses}">
            <video class="${assetClasses}" controls playsinline preload="metadata" style="${sharedStyle}">
              <source src="${escapeHtml(media.src)}" />
            </video>
          </figure>
        `;
      }

      return `
        <figure class="${figureClasses}">
          <img
            class="${assetClasses}"
            src="${escapeHtml(media.src)}"
            alt="${escapeHtml(media.alt || "")}"
            loading="eager"
            style="${sharedStyle}"
          />
        </figure>
      `;
    }

    function lessonMatches(lesson, query) {
      if (!query) return true;
      const normalized = query.toLowerCase();
      if (`${lesson.number} ${lesson.title} ${lesson.summary}`.toLowerCase().includes(normalized)) {
        return true;
      }
      return lesson.slides.some((slide) => JSON.stringify(slide).toLowerCase().includes(normalized));
    }

    function getMatchingSlides(lesson) {
      if (!state.search) return lesson.slides;
      const normalized = state.search.toLowerCase();
      const titleMatch = `${lesson.number} ${lesson.title} ${lesson.summary}`.toLowerCase().includes(normalized);
      if (titleMatch) return lesson.slides;
      const matches = lesson.slides.filter((slide) => JSON.stringify(slide).toLowerCase().includes(normalized));
      return matches;
    }

    function getCurrentLesson() {
      return lessons.find((lesson) => lesson.number === state.selectedLesson) || lessons[0];

      return lessons.filter((lesson) => lessonMatches(lesson, state.search));
    }

    function clampSlideIndex() {
      const slides = getMatchingSlides(getCurrentLesson());
      if (slides.length === 0) {
        state.slideIndex = 0;
        return;
      }
      if (state.slideIndex >= slides.length) state.slideIndex = slides.length - 1;
      if (state.slideIndex < 0) state.slideIndex = 0;
    }

                `).join("")}
              </div>
            </div>
          </div>
        `
      });
    }

    function renderVisualCallout(slide) {
      const visual = slide.image
        ? renderMediaAsset(slide.image, "visual-media-frame")
        : slide.visual === "cups"
        ? `
          <div class="visual-board">
            <div class="cups-visual">
              <div class="cup" style="--cup:#f97316"></div>
              <div class="cup" style="--cup:#38bdf8"></div>
            </div>
          </div>
        `
        : `
          <div class="visual-board">
            <div class="phones-visual">
              <div class="phone">
                <div class="phone-row"></div>
                <div class="phone-card"></div>
                <div class="phone-footer">
                  <div class="phone-tab"></div><div class="phone-tab"></div><div class="phone-tab"></div><div class="phone-tab"></div>
                </div>
              </div>
              <div class="phone">
                <div class="phone-row"></div>
                <div class="phone-card"></div>
                <div class="phone-footer">
                  <div class="phone-tab"></div><div class="phone-tab"></div><div class="phone-tab"></div><div class="phone-tab"></div>
                </div>
              </div>
              <div class="phone">
                <div class="phone-row"></div>
                <div class="phone-card"></div>
                <div class="phone-footer">
                  <div class="phone-tab"></div><div class="phone-tab"></div><div class="phone-tab"></div><div class="phone-tab"></div>
                </div>
              </div>
            </div>
          </div>
        `;

      return renderSlideShell({
        eyebrow: "Applied UX",
        title: slide.title,
        titleClass: "dark",
        subtitle: slide.lead || "",
        body: `
          <div class="visual-layout">
            <div>
              <ul class="bullet-grid">
                ${slide.bullets.map((bullet) => `<li>${escapeHtml(bullet)}</li>`).join("")}
              </ul>
            </div>
            ${visual}
          </div>
        `
      });
    }

    function renderTriad(slide) {
      return renderSlideShell({
        eyebrow: "Framing",
        title: slide.title,
        body: `
          <div class="triad-grid">
            ${slide.items.map((item) => `
              <div class="triad-card">
                <strong>${escapeHtml(item.title)}</strong>
                <p>${escapeHtml(item.copy)}</p>
              </div>
            `).join("")}
          </div>
        `
      });
    }

    function renderPrompt(slide) {
      return `
        <div class="slide-content prompt-slide">
          <div class="prompt-block">
            ${renderSlideHeader({
              eyebrow: slide.badge || "",
              title: slide.title,
              subtitle: slide.subtitle || ""
            })}
          </div>
        </div>
      `;
    }

    function renderPromptAnswer(slide) {
      return `
        <div class="slide-content prompt-slide">
          <div class="prompt-answer-layout">
            <div class="prompt-block">
              <div class="thought-badge" aria-hidden="true">?</div>
              <p class="prompt-answer">${escapeHtml(slide.title)}</p>
              ${slide.subtitle ? `<p class="slide-subtitle">${escapeHtml(slide.subtitle)}</p>` : ""}
            </div>
            ${slide.image ? renderMediaAsset(slide.image, "prompt-media-frame") : ""}
          </div>
        </div>
      `;
    }

    function renderRoleGrid(slide) {
      return renderSlideShell({
        eyebrow: "Role blend",
        title: slide.title,
        body: `
          <div class="cards-grid role-grid">
            ${slide.roles.map((role, index) => `
              <div class="role-card ${index < slide.activeCount ? "active" : ""}">
                <div class="role-icon ${role.icon ? "has-media" : ""}">
                  ${role.icon
                    ? `<img class="media-asset" src="${escapeHtml(role.icon.src)}" alt="${escapeHtml(role.icon.alt || role.label)}" loading="eager" style="object-fit:contain;object-position:center;" />`
                    : escapeHtml(role.label.charAt(0))}
                </div>
                <h3>${escapeHtml(role.label)}</h3>
                <p>${escapeHtml(role.description)}</p>
              </div>
            `).join("")}
          </div>
        `
      });
    }

    function renderBenefits(slide) {
      return renderSlideShell({
        eyebrow: "Why it matters",
        title: slide.title,
        body: `
          <ul class="benefit-list">
            ${slide.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        `
      });
    }

    function renderTimelineEvent(slide) {
      return renderSlideShell({
        eyebrow: "History",
        title: slide.title,
        subtitle: slide.year || "",
        body: `
          <div class="timeline-layout">
            <div class="timeline-rail">
              <div class="timeline-dot"></div>
            </div>
            <div class="timeline-body">
              <div class="timeline-content">
                <div class="statement-card">${escapeHtml(slide.body)}</div>
                ${slide.image ? renderMediaAsset(slide.image, "timeline-media-frame") : ""}
              </div>
            </div>
          </div>
        `
      });
    }

    function renderGallery(slide) {
      return renderSlideShell({
        eyebrow: "Examples",
        title: slide.title,
        subtitle: slide.lead || "",
        body: `
          <div class="gallery-grid">
            ${slide.items.map((item) => `
              <div class="gallery-card">
                ${item.image ? renderMediaAsset(item.image, "gallery-media-frame") : ""}
                <strong>${escapeHtml(item.title || item)}</strong>
              </div>
            `).join("")}
          </div>
        `
      });
    }

    function renderQuote(slide) {
      return renderSlideShell({
        eyebrow: "Design philosophy",
        title: slide.title,
        note: slide.attribution || "",
        body: `
          <div class="quote-layout">
            ${slide.image ? renderMediaAsset(slide.image, "quote-media-frame") : `
              <div class="book-cover">
                <small>Classic industrial design</small>
                <strong>Designing for People</strong>
                <span>${escapeHtml(slide.attribution)}</span>
              </div>
            `}
            <div class="quote-block">
              <p><strong>${escapeHtml(slide.quote)}</strong></p>
            </div>
          </div>
        `
      });
    }

    function renderBarChart(slide) {
      const barRows = slide.bars.map((bar) => `
        <div class="bar-row">
          <div class="bar-label">${escapeHtml(bar.label)}</div>
          <div class="bar-track"><span class="bar-fill" style="width:${bar.value}%"></span></div>
          <div class="bar-value">${escapeHtml(bar.value)}%${bar.note ? ` • ${escapeHtml(bar.note)}` : ""}</div>
        </div>
      `).join("");

      return renderSlideShell({
        eyebrow: "Survey",
        title: slide.title,
        subtitle: slide.lead || "",
        body: `
          <div class="chart-shell ${slide.image ? "media-shell" : ""}">
            ${slide.image ? renderMediaAsset(slide.image, "chart-media-frame") : `<div class="bar-chart">${barRows}</div>`}
            <div class="bar-chart">
              ${slide.image ? barRows : ""}
              <div class="chart-note">${escapeHtml(slide.insight)}</div>
            </div>
          </div>
        `
      });
    }

    function buildConicGradient(slices) {
      let cursor = 0;
      return slices.map((slice) => {
        const next = cursor + slice.value;
        const segment = `${slice.color} ${cursor}% ${next}%`;
        cursor = next;
        return segment;
      }).join(", ");
    }

    function renderPieChart(slide) {
      return renderSlideShell({
        eyebrow: "Survey",
        title: slide.title,
        subtitle: slide.lead || "",
        body: `
          <div class="chart-shell ${slide.image ? "media-shell" : ""}">
            ${slide.image ? renderMediaAsset(slide.image, "chart-media-frame") : `
              <div class="donut-shell">
                <div class="donut" style="--chart: conic-gradient(${buildConicGradient(slide.slices)})">
                  <span>${escapeHtml(slide.centerLabel || "")}</span>
                </div>
              </div>
            `}
            <div class="legend">
              ${slide.slices.map((slice) => `
                <div class="legend-item">
                  <span class="legend-swatch" style="background:${slice.color}"></span>
                  <span class="legend-label">${escapeHtml(slice.label)}</span>
                  <span class="legend-value">${escapeHtml(slice.value)}%</span>
                </div>
              `).join("")}
              <div class="chart-note">${escapeHtml(slide.insight)}</div>
            </div>
          </div>
        `
      });
    }

    function renderUsabilityPuzzle(slide) {
      return renderSlideShell({
        eyebrow: "Usability",
        title: slide.title,
        body: `
          <div class="usability-layout">
            <div class="puzzle-grid">
              ${slide.pieces.map((piece) => `
                <div class="puzzle-piece">
                  <strong>${escapeHtml(piece.title)}</strong>
                  <span>${escapeHtml(piece.copy)}</span>
                </div>
              `).join("")}
            </div>
            ${slide.image ? `
              <div>
                ${renderMediaAsset(slide.image, "chart-media-frame")}
                <div class="chart-note">${escapeHtml(slide.note)}</div>
              </div>
            ` : `<div class="chart-note">${escapeHtml(slide.note)}</div>`}
          </div>
        `
      });
    }

    function renderComparison(slide) {
      return renderSlideShell({
        eyebrow: "Example",
        title: slide.title,
        subtitle: slide.lead || "",
        body: `
          <div class="comparison-grid">
            ${slide.cards.map((card) => `
              <div class="comparison-card">
                ${card.image ? renderMediaAsset(card.image, "comparison-media-frame") : `
                  <div class="comparison-visual ${escapeHtml(slide.visual)}">
                    <span class="comparison-badge">${escapeHtml(card.title)}</span>
                  </div>
                `}
                <h3>${escapeHtml(card.title)}</h3>
                <p>${escapeHtml(card.copy)}</p>
              </div>
            `).join("")}
          </div>
        `
      });
    }

    function renderHistoryCards(slide) {
      return renderSlideShell({
        eyebrow: "Interface history",
        title: slide.title,
        subtitle: slide.lead || "",
        body: `
          <div class="history-hero">
            ${slide.image ? renderMediaAsset(slide.image, "history-media-frame") : ""}
            <div class="history-layout">
              ${slide.cards.map((card) => `
                <div class="history-card">
                  <strong>${escapeHtml(card.title)}</strong>
                  <p>${escapeHtml(card.copy)}</p>
                </div>
              `).join("")}
            </div>
          </div>
        `
      });
    }

    function renderAcronymList(slide) {
      return renderSlideShell({
        eyebrow: "Emerging directions",
        title: slide.title,
        note: slide.note || "",
        body: `
          <div class="cards-grid">
            ${slide.items.map((item) => `
              <div class="panel-card acronym-grid">
                <div class="acronym-code">${escapeHtml(item.code)}</div>
                <div>
                  <h3>${escapeHtml(item.label)}</h3>
                  <p>One of the capabilities shaping post-desktop interaction.</p>
                </div>
              </div>
            `).join("")}
          </div>
        `
      });
    }

    function renderHomeworkSlide(slide) {
      return renderSlideShell({
        eyebrow: "Assignment",
        title: slide.title,
        body: `
          <ul class="homework-list">
            ${slide.body.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        `
      });
    }

    function renderBooks(slide) {
      return renderSlideShell({
        eyebrow: "Reading list",
        title: slide.title,
        body: `
          ${slide.image ? renderMediaAsset(slide.image, "books-banner") : ""}
          <div class="cards-grid books-grid">
            ${slide.books.map((book) => `
              <div class="book-tile" style="background:${book.color}">
                <small>${escapeHtml(book.author)}</small>
                <strong>${escapeHtml(book.title)}</strong>
              </div>
            `).join("")}
          </div>
        `
      });
    }

    function renderResourcesSlide(slide) {
      return renderSlideShell({
        eyebrow: "Articles",
        title: slide.title,
        body: `
          <ul class="resource-list">
            ${slide.resources.map((resource) => `<li>${escapeHtml(resource)}</li>`).join("")}
          </ul>
        `
      });
    }

    function renderClosing(slide) {
      return `
        <div class="slide-content closing-slide">
          <div class="prompt-block">
            ${renderSlideHeader({
              eyebrow: "Wrap-up",
              title: slide.title,
              subtitle: slide.subtitle || ""
            })}
          </div>
        </div>
      `;
    }

    function renderPlaceholder(slide) {
      return `
        <div class="slide-content prompt-slide">
          <div class="prompt-block">
            ${renderSlideHeader({
              eyebrow: "Coming soon",
              title: slide.title,
              subtitle: slide.body || ""
            })}
          </div>
        </div>
      `;
    }

    function renderSlideMarkup(slide) {
      switch (slide.type) {
        case "cover":
          return renderCover(slide);
        case "profile":
          return renderProfile(slide);
        case "splitBullets":
          return renderSplitBullets(slide);
        case "overviewCards":
          return renderOverviewCards(slide);
        case "definition":
          return renderDefinition(slide);
        case "keyword":
          return renderKeyword(slide);
        case "statement":
          return renderStatement(slide);
        case "visualCallout":
          return renderVisualCallout(slide);
        case "triad":
          return renderTriad(slide);
        case "prompt":
          return renderPrompt(slide);
        case "promptAnswer":
          return renderPromptAnswer(slide);
        case "roleGrid":
          return renderRoleGrid(slide);
        case "benefits":
          return renderBenefits(slide);
        case "timelineEvent":
          return renderTimelineEvent(slide);
        case "gallery":
          return renderGallery(slide);
        case "quote":
          return renderQuote(slide);
        case "barChart":
          return renderBarChart(slide);
        case "pieChart":
          return renderPieChart(slide);
        case "usabilityPuzzle":
          return renderUsabilityPuzzle(slide);
        case "comparison":
          return renderComparison(slide);
        case "historyCards":
          return renderHistoryCards(slide);
        case "acronymList":
          return renderAcronymList(slide);
        case "homeworkSlide":
          return renderHomeworkSlide(slide);
        case "books":
          return renderBooks(slide);
        case "resourcesSlide":
          return renderResourcesSlide(slide);
        case "closing":
          return renderClosing(slide);
        case "placeholder":
          return renderPlaceholder(slide);
        default:
          return renderPlaceholder({
            title: "Slide",
            body: "This slide type is not supported yet."
          });
      }
    }

    function renderSlide() {
      const lesson = getCurrentLesson();
      const slides = getMatchingSlides(lesson);

      if (!slides.length) {
        slideToolbarLeft.innerHTML = `<span class="slide-position">No matching slides</span>`;
        slideCard.innerHTML = `
          <div class="slide-content prompt-slide">
            <div class="prompt-block">
              <h1 class="slide-title">No slides matched “${escapeHtml(state.search)}”</h1>
              <p class="slide-subtitle">Try a broader keyword or choose another lesson from the sidebar.</p>
            </div>
          </div>
        `;
        slideJumpInput.disabled = true;
        slideFullscreenButton.disabled = true;
        footerNote.textContent = "";
        prevButton.disabled = true;
        nextButton.disabled = true;
        return;
      }

      clampSlideIndex();
      const slide = slides[state.slideIndex];
      slideToolbarLeft.innerHTML = `
        <span class="slide-position">${state.slideIndex + 1} / ${slides.length}</span>
      `;
      slideJumpInput.disabled = false;
      slideFullscreenButton.disabled = false;
      slideJumpInput.max = slides.length;
      slideJumpInput.value = state.slideIndex + 1;
      slideJumpTotal.textContent = `/ ${slides.length}`;
      slideCard.innerHTML = renderSlideMarkup(slide);
      footerNote.textContent = "";
      prevButton.disabled = state.slideIndex === 0;
      nextButton.disabled = state.slideIndex === slides.length - 1;
    }

    function renderResources() {
      const lesson = getCurrentLesson();
      if (!lesson.resources.length) {
        resourcesSection.innerHTML = `
          <h2>Resources</h2>
          <p class="empty">No external resources have been attached to this lesson yet.</p>
        `;
        return;
      }

      resourcesSection.innerHTML = `
        <h2>Resources</h2>
        <div class="resource-grid">
          ${lesson.resources.map((resource) => `
            <div class="resource-card">
              <h3><a href="${resource.url}" target="_blank" rel="noreferrer">${escapeHtml(resource.title)}</a></h3>
              <p>${escapeHtml(resource.note)}</p>
              <small>${escapeHtml(resource.source)}</small>
            </div>
          `).join("")}
          ${lesson.books.length ? `
            <div class="resource-card">
              <h3>Recommended books</h3>
              <ul class="note-list">
                ${lesson.books.map((book) => `<li>${escapeHtml(book)}</li>`).join("")}
              </ul>
            </div>
          ` : ""}
        </div>
      `;
    }

    function renderHomework() {
      const lesson = getCurrentLesson();
      if (!lesson.homework) {
        homeworkSection.innerHTML = `
          <h2>Homework</h2>
          <p class="empty">Homework will appear here once this module is uploaded.</p>
        `;
        return;
      }

      homeworkSection.innerHTML = `
        <h2>Homework</h2>
        <div class="resource-card">
          <h3>${escapeHtml(lesson.homework.title)}</h3>
          <p>${escapeHtml(lesson.homework.body)}</p>
        </div>
        <div class="resource-card">
          <h3>Deliverables</h3>
          <ul class="homework-list">
            ${lesson.homework.deliverables.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </div>
        <div class="resource-card">
          <h3>Helpful prompts</h3>
          <ul class="homework-list">
            ${lesson.homework.tips.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    function renderQuiz() {
      const lesson = getCurrentLesson();
      if (!lesson.quiz.length) {
        quizSection.innerHTML = `
          <h2>Quiz</h2>
          <p class="empty">Quiz questions will be generated here after this lesson’s content is added.</p>
        `;
        return;
      }

      quizSection.innerHTML = `
        <h2>Quiz</h2>
        <div class="quiz-grid">
          ${lesson.quiz.map((item, index) => `
            <div class="quiz-card">
              <h3>Question ${index + 1}</h3>
              <p>${escapeHtml(item.prompt)}</p>
              ${item.type === "multiple" ? `
                <ul>
                  ${item.options.map((option) => `<li>${escapeHtml(option)}</li>`).join("")}
                </ul>
              ` : '<p class="slide-note">Short-answer question</p>'}
              <details class="quiz-answer">
                <summary>Reveal answer</summary>
                <p>${escapeHtml(item.answer)}</p>
              </details>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderProgress() {
      const progress = Math.round((state.viewedLessons.size / lessons.length) * 100);
      progressPill.innerHTML = `
        <strong>${progress}% viewed</strong>
        <span>${state.viewedLessons.size} of ${lessons.length} lessons opened</span>
      `;
    }

    function render() {
      syncSelectionWithSearch();
      renderSidebar();
      renderLessonHero();
      renderSlide();
      renderResources();
      renderHomework();
      renderQuiz();
      renderProgress();
      setActiveTab(state.activeTab);
    }

    panelTabs.forEach((button) => {
      button.addEventListener("click", () => {
        setActiveTab(button.dataset.tab, { focusSlides: button.dataset.tab === "slides" });
      });
    });

    prevButton.addEventListener("click", goToPreviousSlide);
    nextButton.addEventListener("click", goToNextSlide);

    slideJumpForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const slides = getMatchingSlides(getCurrentLesson());
      const requested = Math.min(slides.length, Math.max(1, Number(slideJumpInput.value) || 1));
      state.slideIndex = requested - 1;
      renderSlide();
      viewerShell.focus();
    });

    searchInput.addEventListener("input", (event) => {
      state.search = event.target.value.trim();
      state.slideIndex = 0;
      render();
    });

    menuButton.addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") {
        return;
      }

      if (["ArrowRight", "ArrowDown", "PageDown", " ", "Spacebar", "Enter"].includes(event.key) && !nextButton.disabled && state.activeTab === "slides") {
        event.preventDefault();
        goToNextSlide();
      }

      if (["ArrowLeft", "ArrowUp", "PageUp"].includes(event.key) && !prevButton.disabled && state.activeTab === "slides") {
        event.preventDefault();
        goToPreviousSlide();
      }

      if (event.key === "Escape") {
        sidebar.classList.remove("open");
      }
    });

    async function toggleFullscreen() {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        if (state.activeTab !== "slides") {
          setActiveTab("slides", { focusSlides: true });
        }
        await viewerShell.requestFullscreen();
        viewerShell.focus();
      }
    }

    fullscreenButton.addEventListener("click", toggleFullscreen);
    slideFullscreenButton.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.setAttribute("aria-label", document.fullscreenElement ? "Exit fullscreen" : "Enter fullscreen");
      slideFullscreenButton.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
      if (document.fullscreenElement === viewerShell) {
        viewerShell.focus();
      }
    });

    render();
  </script>
</body>
</html>
